<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>海の糸 第八話｜あんこで包む、昆布の地図</title>
<style>
:root{
  --bg:#F3EEE4; --ink:#1A2238; --sub:#6B6F7B; --line:rgba(26,34,56,.16);
  --accent:#2F5D8A; --panel:rgba(243,238,228,.95); --on:#FFFFFF;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#14161B; --ink:#ECE7DC; --sub:#9AA0AD; --line:rgba(255,255,255,.16);
         --accent:#8FB8E0; --panel:rgba(20,22,27,.94); --on:#14161B; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
body.paged{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}

/* ---- header ---- */
.bar{position:sticky;top:0;z-index:30;background:var(--panel);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;align-items:center;gap:12px}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:15px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{display:block;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;flex:none;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:12px;font-weight:700;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.count{flex:none;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}

/* ---- 縦読み ---- */
#scroll{max-width:760px;margin:0 auto;padding:12px 0 0}
.pg{margin:0 0 10px}
.pg img{display:block;width:100%;height:auto;background:rgba(127,127,127,.12)}
.end{max-width:760px;margin:0 auto;padding:36px 16px 64px;text-align:center}
.end p{margin:0 0 6px;font-size:13px;color:var(--sub);line-height:1.8}
.end .name{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:2px}
.btn{display:inline-block;margin-top:18px;border:1px solid var(--ink);background:transparent;
  border-radius:999px;padding:11px 26px;font-size:14px;font-weight:700}
body.paged #scroll, body.paged .end{display:none}

/* ---- ページ送り ---- */
#stage{display:none;position:fixed;left:0;right:0;bottom:0;top:var(--barh,56px);z-index:10;
  padding:8px 0 52px;align-items:center;justify-content:center;
  touch-action:pan-y;user-select:none;-webkit-user-select:none}
body.paged #stage{display:flex}
#stage img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;
  box-shadow:0 6px 28px rgba(0,0,0,.22)}
.zone{position:absolute;top:0;bottom:52px;width:50%;border:0;background:transparent;padding:0;
  -webkit-tap-highlight-color:transparent}
.zone.next{left:0} .zone.prev{right:0}
.zone:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.nav{position:absolute;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;gap:10px;
  padding:0 16px;background:var(--panel);border-top:1px solid var(--line)}
.nav button{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;
  padding:7px 12px;font-size:12px;font-weight:700}
.nav button:disabled{opacity:.35;cursor:default}
.nav input{flex:1;min-width:0;accent-color:var(--accent)}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:rgba(20,22,27,.86);color:#fff;border-radius:12px;padding:14px 18px;
  font-size:13px;line-height:1.9;text-align:center;white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .35s}
.hint.show{opacity:1}
@media (prefers-reduced-motion:reduce){.hint{transition:none}}
</style>
</head>
<body>

<header class="bar" id="bar">
  <div class="ttl">
    <b>海の糸　第八話</b>
    <span>あんこで包む、昆布の地図</span>
  </div>
  <div class="seg" role="group" aria-label="読み方の切り替え">
    <button type="button" id="mScroll" aria-pressed="true">縦読み</button>
    <button type="button" id="mPaged" aria-pressed="false">ページ</button>
  </div>
  <div class="count" id="count" aria-live="polite">1 / 26</div>
</header>

<main id="scroll"></main>

<section class="end" id="end">
  <p class="name">海の糸　第八話　あんこで包む、昆布の地図</p>
  <p>原作　昆布のミライ研究所</p>
  <button type="button" class="btn" id="again">最初から読む</button>
</section>

<div id="stage" aria-label="ページ送りビュー">
  <img id="page" alt="" width="1024" height="1536">
  <button type="button" class="zone next" id="zNext" aria-label="次のページ"></button>
  <button type="button" class="zone prev" id="zPrev" aria-label="前のページ"></button>
  <div class="hint" id="hint">左側をタップ　次のページへ<br>右側をタップ　前のページへ</div>
  <div class="nav">
    <button type="button" id="bNext">次へ</button>
    <input type="range" id="slider" min="1" max="26" step="1" value="1" dir="rtl" aria-label="ページ移動">
    <button type="button" id="bPrev">戻る</button>
  </div>
</div>

<script>
(function(){
  var N = 26;
  var pad = function(n){ return String(n).padStart(2,'0'); };
  var src = function(n){ return 'pages/' + pad(n) + '.jpg'; };
  var alt = function(n){ return '海の糸 第八話 ' + n + 'ページ'; };
  var store = {
    get:function(k){ try{ return localStorage.getItem('umi08.'+k); }catch(e){ return null; } },
    set:function(k,v){ try{ localStorage.setItem('umi08.'+k, v); }catch(e){} }
  };
  var $ = function(id){ return document.getElementById(id); };
  var body = document.body, bar = $('bar'), scroll = $('scroll'), img = $('page'),
      count = $('count'), slider = $('slider'), hint = $('hint');

  // 既定：スマホは縦読み、画面の広い端末はページ送り
  var wide = window.matchMedia('(min-width: 900px)').matches;
  var mode = store.get('mode') || (wide ? 'paged' : 'scroll');
  var cur = Math.min(N, Math.max(1, parseInt(store.get('page'),10) || 1));

  // 縦読み用のページを並べる
  var figs = [];
  for (var i=1;i<=N;i++){
    var f = document.createElement('figure'); f.className='pg'; f.dataset.n=i;
    var im = document.createElement('img');
    im.src = src(i); im.alt = alt(i); im.width=1024; im.height=1536;
    im.decoding='async'; if(i>2) im.loading='lazy';
    f.appendChild(im); scroll.appendChild(f); figs.push(f);
  }

  function setBarH(){ document.documentElement.style.setProperty('--barh', bar.offsetHeight+'px'); }
  function paint(){
    count.textContent = cur + ' / ' + N;
    slider.value = cur;
    $('bNext').disabled = (cur>=N);
    $('bPrev').disabled = (cur<=1);
    store.set('page', cur);
  }
  function show(n){
    cur = Math.min(N, Math.max(1, n));
    img.src = src(cur); img.alt = alt(cur);
    [cur+1, cur+2].forEach(function(k){ if(k<=N){ var p=new Image(); p.src=src(k); } });
    paint();
  }
  function setMode(m, keep){
    mode = m; store.set('mode', m);
    body.classList.toggle('paged', m==='paged');
    $('mScroll').setAttribute('aria-pressed', m==='scroll');
    $('mPaged').setAttribute('aria-pressed', m==='paged');
    setBarH();
    if (m==='paged'){
      show(cur);
      if(!store.get('hinted')){
        hint.classList.add('show');
        setTimeout(function(){ hint.classList.remove('show'); }, 2600);
        store.set('hinted','1');
      }
    } else if (keep !== false){
      var t = figs[cur-1];
      if (t && cur>1) window.scrollTo(0, t.getBoundingClientRect().top + window.scrollY - bar.offsetHeight - 8);
      paint();
    }
  }

  // 縦読み中の現在ページ追跡
  if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(es){
      if (mode!=='scroll') return;
      es.forEach(function(e){
        if (e.isIntersecting){ cur = parseInt(e.target.dataset.n,10); paint(); }
      });
    }, {rootMargin:'-45% 0px -45% 0px', threshold:0});
    figs.forEach(function(f){ io.observe(f); });
  }

  var next = function(){ if(cur<N) show(cur+1); };
  var prev = function(){ if(cur>1) show(cur-1); };
  $('zNext').addEventListener('click', next);
  $('zPrev').addEventListener('click', prev);
  $('bNext').addEventListener('click', next);
  $('bPrev').addEventListener('click', prev);
  slider.addEventListener('input', function(){ show(parseInt(slider.value,10)); });
  $('mScroll').addEventListener('click', function(){ setMode('scroll'); });
  $('mPaged').addEventListener('click', function(){ setMode('paged'); });
  $('again').addEventListener('click', function(){ cur=1; paint(); window.scrollTo(0,0); });

  // スワイプ（右へ払うと次のページ。日本の漫画の綴じ方向）
  var sx=null, sy=null, stage=$('stage');
  stage.addEventListener('touchstart', function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if(sx===null) return;
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
    if (Math.abs(dx)>48 && Math.abs(dx)>Math.abs(dy)*1.4){ if(dx>0) next(); else prev(); e.preventDefault(); }
  });

  document.addEventListener('keydown', function(e){
    if (mode!=='paged' || e.target===slider) return;
    if (e.key==='ArrowLeft' || e.key===' ' || e.key==='ArrowDown' || e.key==='PageDown'){ next(); e.preventDefault(); }
    else if (e.key==='ArrowRight' || e.key==='ArrowUp' || e.key==='PageUp'){ prev(); e.preventDefault(); }
  });
  window.addEventListener('resize', setBarH);

  setMode(mode);
})();
</script>
</body>
</html>
